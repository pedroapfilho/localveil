overrides:
  # Native runtimes share a Linux SONAME, so Transformers must load the detector's runtime.
  "@huggingface/transformers>onnxruntime-node": "catalog:"
  # Security: force patched transitive releases to clear pnpm audit advisories.
  # Each pin is the lowest release that carries the fix.
  adm-zip: "^0.6.1"
  brace-expansion: "^5.0.12"
  sharp: "^0.35.4"

packages:
  - apps/*
  - packages/*

catalog:
  onnxruntime-node: 1.30.0
  onnxruntime-web: 1.30.0

allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false

  tesseract.js: false

minimumReleaseAgeExclude:
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness

peerDependencyRules:
  allowedVersions:
    "@typescript-eslint/parser>typescript": "7"
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

packageExtensions:
  # Transformers imports this directly but omits it from its dependency manifest.
  "@huggingface/transformers":
    dependencies:
      onnxruntime-common: "1.30.0"
