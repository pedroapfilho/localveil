name: Check
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 7 4 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan check
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore Turbo task cache
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-check-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-check-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-check-main-
      - run: node .github/ci/ci.mjs run check -- pnpm check:shadcn
      - run: node .github/ci/ci.mjs run check -- pnpm build
      - run: node .github/ci/ci.mjs run check -- pnpm exec oxlint .
      - run: node .github/ci/ci.mjs run check -- pnpm format:check
      - run: node .github/ci/ci.mjs run typecheck -- pnpm typecheck
      - run: node .github/ci/ci.mjs run test -- pnpm test
      - run: node .github/ci/ci.mjs run check -- pnpm fallow:dead
      - name: Audit changed code
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- pnpm fallow:audit
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history for secrets
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- gitleaks git --redact --verbose --exit-code 1
      - name: Install zizmor
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_VERSION: 1.31.1
        run: |
          curl -sSfL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zizmor
          zizmor --version
      - name: Audit workflows
        if: ${{ !cancelled() }}
        run: node .github/ci/ci.mjs run lint -- zizmor --offline --format github .github
      - name: Audit dependencies
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: node .github/ci/ci.mjs run lint -- pnpm audit --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
